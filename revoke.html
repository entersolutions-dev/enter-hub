<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revocación Habeas Data - ENTER SOLUTIONS S.A.S.</title><style>body{font-family:Arial,sans-serif;margin:40px;line-height:1.6;color:#333;background-color:#f9f9f9}.container{max-width:800px;margin:auto;background:#fff;padding:30px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,.1)}h1{color:#d9534f}.metadata{background:#fdf7f7;padding:15px;border-left:4px solid #d9534f;margin-bottom:20px;font-size:.9em}.form-group{margin-bottom:15px}label{display:block;font-weight:bold;margin-bottom:5px}input[type=email],textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}textarea{height:80px;resize:vertical}button{background-color:#d9534f;color:#fff;border:none;padding:12px 20px;font-size:16px;border-radius:4px;cursor:pointer;width:100%}button:disabled{background-color:#ccc;cursor:not-allowed}#response-message{margin-top:15px;font-weight:bold;text-align:center}</style></head><body><div class="container"><h1>Solicitud de Revocación de Consentimiento</h1><div class="metadata"><strong>Empresa:</strong> ENTER SOLUTIONS S.A.S. | <strong>NIT:</strong> 901.079.829-7<br><strong>Versión Política:</strong> v1.0 | <strong>Contacto:</strong> habeasdata@entersolutions.co</div><form id="revoke-habeas-form"><div class="form-group"><label for="client_email">Correo Electrónico Registrado:</label><input type="email" id="client_email" required placeholder="ejemplo@empresa.com"></div><div class="form-group"><label for="reason">Motivo de la Revocación (Opcional):</label><textarea id="reason" placeholder="Indique la razón de su solicitud"></textarea></div><button type="submit" id="submit-btn">Revocar Consentimiento</button></form><div id="response-message"></div></div><script>document.getElementById("revoke-habeas-form").addEventListener("submit",async function(e){e.preventDefault();const t=document.getElementById("client_email").value,e_reason=document.getElementById("reason").value||"Solicitud de baja voluntaria",n=document.getElementById("submit-btn"),s=document.getElementById("response-message");n.disabled=!0,s.innerText="Procesando revocación...";try{const e=await fetch("http://localhost:5678/webhook/enter-hub-revoke",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({client_email:t,channel:"LANDING_PAGE_REVOKE",reason:e_reason})});if(!e.ok)throw new Error("Error en la revocación");s.style.color="green",s.innerText="Su consentimiento ha sido revocado exitosamente.",document.getElementById("revoke-habeas-form").reset()}catch(e){s.style.color="red",s.innerText="Hubo un error al procesar la revocación. Intente nuevamente."}finally{n.disabled=!1}});</script></body></html>
